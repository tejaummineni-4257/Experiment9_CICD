name: AI Model CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-and-store-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Train machine learning model
        run: python train_model.py

      - name: Run automated tests
        run: python test_model.py

      - name: Verify model artifact
        run: |
          python -c "import os; assert os.path.isfile('model.joblib'); print('Model artifact verified successfully')"

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-ai-model
          path: model.joblib
          if-no-files-found: error
          retention-days: 30